# Place these locations inside your existing HTTPS server block; set root to the built dist directory.
location ~ ^/assets/models/optimized/[a-z_]+\.[a-f0-9]{12}\.glb$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
# Optional transfer compression, without a second application/service-worker cache.
gzip on;
gzip_types application/javascript text/css application/json model/gltf-binary application/octet-stream;
